<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoodCosta Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="loginView" class="center">
  <div class="login-card">
    <div class="logo">🍽️</div>
    <h1>FoodCosta Admin</h1>
    <p>Login to manage restaurant orders.</p>
    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div><strong>FoodCosta</strong><span>Admin Dashboard</span></div>
    <button id="logoutBtn" class="ghost">Logout</button>
  </header>

  <main>
    <section class="stats">
      <div><span>New</span><strong id="newCount">0</strong></div>
      <div><span>Preparing</span><strong id="prepCount">0</strong></div>
      <div><span>Today Orders</span><strong id="todayCount">0</strong></div>
      <div><span>Today Sales</span><strong id="todaySales">₹0</strong></div>
    </section>

    <section class="toolbar">
      <h2>Orders</h2>
      <div>
        <select id="statusFilter">
          <option value="all">All Orders</option>
          <option value="New">New</option>
          <option value="Accepted">Accepted</option>
          <option value="Preparing">Preparing</option>
          <option value="Ready">Ready</option>
          <option value="Completed">Completed</option>
          <option value="Rejected">Rejected</option>
        </select>
        <button id="refreshBtn" class="ghost">Refresh</button>
      </div>
    </section>

    <section id="orders" class="orders"></section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
